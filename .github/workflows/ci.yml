    permissions:
      contents: read
    uses: baskingspot/gh-actions/.github/workflows/ci.yml@ebf26b4588ad1706f06162ce837eda1cf094508e # v0.13.2
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
