name: release

# A v* tag publishes bs through the org's release workflow: CI, the
# platforms in .github/release.yaml, the GitHub release, and the Homebrew
# cask in baskingspot/homebrew-tap.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: baskingspot/gh-actions/.github/workflows/release.yml@a8c8fd0d7e28ac1ceffd1c0eb4dc642f09756c60 # v0.13.3
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
