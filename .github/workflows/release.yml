name: release

# A v* tag publishes bs through the org's release workflow: CI, the
# platforms in .github/release.yaml, the GitHub release, and the Homebrew
# cask in baskingspot/homebrew-tap.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: baskingspot/gh-actions/.github/workflows/release.yml@2672cf42962893480a7410ba431f1da2a5b5cd47 # v0.13.1
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
