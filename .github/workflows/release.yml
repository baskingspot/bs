name: release

# A v* tag publishes bs through the org's release workflow: CI, the
# platforms in .github/release.yaml, the GitHub release, and the Homebrew
# cask in baskingspot/homebrew-tap.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: baskingspot/gh-actions/.github/workflows/release.yml@0a6c7e44b6ddcfcec8da5c30be351a31f75a3cc8 # v0.13.0
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
