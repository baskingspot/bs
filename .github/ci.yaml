# x86_64 Linux is first class: tests, lint, and ziglint block. The tests run
# as parallel jobs, one or more of build.zig's test-* steps each, which
# together are `zig build test` (test-nightly aside, which
# workflows/nightly.yml runs). The macOS lane runs the same tests on a real
# Apple Silicon Mac and does not block until it passes. The conformance
# measure runs upstream's test/behavior and its std tests on every target the
# runner can run (aarch64-linux under qemu) and fails when bs passes fewer
# tests than upstream's baseline (tools/conformance/run.py). It blocks on
# Linux and shows on the Mac, as the tests do.
jobs:
  - recipe: test-steps test-link-1
  - recipe: test-steps test-link-2
  - recipe: test-steps test-run-1
  - recipe: test-steps test-run-2
  - recipe: test-steps test-edit
  - recipe: test-steps test-cache
  - recipe: test-steps test-diag test-unit
  - recipe: lint
  - recipe: test-steps test-link
    runners: [macos-26]
    blocking: false
  - recipe: test-steps test-run-1
    runners: [macos-26]
    blocking: false
  - recipe: test-steps test-run-2
    runners: [macos-26]
    blocking: false
  - recipe: test-steps test-edit test-unit
    runners: [macos-26]
    blocking: false
  - recipe: test-steps test-cache
    runners: [macos-26]
    blocking: false
  - recipe: test-steps test-diag
    runners: [macos-26]
    blocking: false
  - recipe: ziglint
  - recipe: conformance
  - recipe: conformance --std
  - recipe: conformance
    runners: [macos-26]
    blocking: false
  - recipe: conformance --std
    runners: [macos-26]
    blocking: false
